<div class="backdrop">
  <div class="modal">
    <h2>{{ expense() ? 'Editar gasto' : 'Nuevo gasto' }}</h2>

    <form [formGroup]="form">
      <label>Concepto <input formControlName="description" placeholder="Ej: Cena" /></label>
      <label>Monto <input formControlName="amount" type="number" step="0.01" min="0" /></label>
      <label>¿Quién pagó?
        <select formControlName="paid_by">
          <option value="" disabled>Elegir</option>
          @for (p of participants(); track p.id) {
            <option [value]="p.id">{{ p.name }}</option>
          }
        </select>
      </label>
    </form>

    <div class="mode">
      <button type="button" [class.active]="mode() === 'equal'" (click)="mode.set('equal')">Partes iguales</button>
      <button type="button" [class.active]="mode() === 'fixed'" (click)="mode.set('fixed')">Montos fijos</button>
    </div>

    <div class="participants">
      @for (p of participants(); track p.id) {
        <label class="check">
          <input type="checkbox" [checked]="selected().has(p.id)" (change)="toggle(p.id)" />
          {{ p.name }}
          @if (mode() === 'fixed' && selected().has(p.id)) {
            <input type="number" step="0.01" min="0" [value]="fixedAmounts()[p.id] ?? 0" (input)="setFixed(p.id, +$any($event.target).value)" />
          }
        </label>
      }
    </div>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <div class="actions">
      <button class="secondary" (click)="cancelled.emit()">Cancelar</button>
      <button (click)="save()">Guardar</button>
    </div>
  </div>
</div>
